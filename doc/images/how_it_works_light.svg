<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 24 1000 312" width="1000" height="312" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">How Reusable IAP fits in your app</title>
<desc id="desc">Your paywall calls buy and restore on Reusable IAP, and gets back products, access and errors. Reusable IAP uses the in_app_purchase plugin, which reaches the App Store and Google Play. It can also ask your own server to check a purchase.</desc>
<defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B8FE6"/><stop offset="1" stop-color="#02569B"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0.8 L9 5 L0 9.2 Z" fill="#6E7781"/></marker>
<filter id="lift" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0175C2" flood-opacity="0.35"/></filter>
</defs>
<rect x="24" y="88" width="176" height="88" rx="14" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="112.0" y="129.0" text-anchor="middle" font-size="19" font-weight="600" fill="#1F2328">Your paywall</text>
<text x="112.0" y="150.0" text-anchor="middle" font-size="14" fill="#59636E">your UI, your state</text>

<path d="M204 116 H382" fill="none" stroke="#6E7781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="295" y="104" text-anchor="middle" font-size="14.5" fill="#424A53">buy, restore</text>
<path d="M386 148 H208" fill="none" stroke="#6E7781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="295" y="172" text-anchor="middle" font-size="14.5" fill="#424A53">products, access, errors</text>
<rect x="390" y="78" width="184" height="108" rx="16" fill="url(#accent)" filter="url(#lift)"/>
<text x="482" y="128" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Reusable IAP</text>
<text x="482" y="151" text-anchor="middle" font-size="14" fill="#DCEEFF">this package</text>
<path d="M578 132 H606" fill="none" stroke="#6E7781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="614" y="88" width="180" height="88" rx="14" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="704.0" y="129.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1F2328">in_app_purchase</text>
<text x="704.0" y="150.0" text-anchor="middle" font-size="14" fill="#59636E">Flutter's plugin</text>

<path d="M798 132 H804 Q812 132 812 124 V90 Q812 82 820 82 H828" fill="none" stroke="#6E7781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M804 132 Q812 132 812 140 V174 Q812 182 820 182 H828" fill="none" stroke="#6E7781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="836" y="44" width="140" height="76" rx="14" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<rect x="836" y="60" width="4" height="44" rx="2" fill="#0A84FF"/>
<text x="906.0" y="79.0" text-anchor="middle" font-size="19" font-weight="600" fill="#1F2328">App Store</text>
<text x="906.0" y="100.0" text-anchor="middle" font-size="14" fill="#59636E">StoreKit 2</text>

<rect x="836" y="144" width="140" height="76" rx="14" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<rect x="836" y="160" width="4" height="44" rx="2" fill="#1A9E5C"/>
<text x="906.0" y="179.0" text-anchor="middle" font-size="19" font-weight="600" fill="#1F2328">Google Play</text>
<text x="906.0" y="200.0" text-anchor="middle" font-size="14" fill="#59636E">Play Billing</text>

<path d="M482 192 V248" fill="none" stroke="#6E7781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7" marker-end="url(#arrow)"/>
<text x="496" y="226" font-size="14.5" fill="#424A53">optional check</text>
<rect x="390" y="256" width="184" height="64" rx="14" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5" stroke-dasharray="7 6"/>
