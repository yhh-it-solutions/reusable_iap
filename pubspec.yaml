name: reusable_iap
description: In-app purchases for Flutter. Subscriptions, consumables and non-consumables on the App Store and Google Play, with optional backend verification.
version: 0.1.3

environment:
  sdk: ^3.11.1
  flutter: ">=3.41.0"

topics:
  - in-app-purchase
  - subscriptions
  - billing
  - monetization
  - storekit

dependencies:
  equatable: ">=2.0.8 <4.0.0"
  flutter:
    sdk: flutter
  in_app_purchase: ^3.3.0
  in_app_purchase_storekit: ^0.4.17

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
